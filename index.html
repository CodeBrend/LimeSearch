<!DOCTYPE PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>LimeSearch</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.basic.min.js"></script>
  <style type="text/css">
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 40px 0;
      text-align: center;
    }
    
    /* Ana Taşıyıcı Konteyner */
    #container {
      width: 650px;
      margin: 0 auto;
      text-align: left;
    }

    /* Logo ve Başlık Alanı */
    #logo-container {
      text-align: center;
      margin-bottom: 25px;
    }

    #logo-img {
      max-width: 250px;
      height: auto;
      border: 0;
    }

    /* Arama Kutusu Tablo Yapısı */
    .search-table {
      width: 100%;
      border-collapse: collapse;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #dfe1e5;
      border-radius: 24px;
      outline: none;
      box-sizing: border-box;
    }

    .search-input:focus {
      border-color: #1a73e8;
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
    }

    /* Arama Sonuçları Alanı */
    #results-list {
      list-style-type: none;
      padding: 0;
      margin-top: 25px;
    }

    .result-item {
      background-color: #ffffff;
      border: 1px solid #dfe1e5;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .result-title {
      font-size: 18px;
      color: #1a0dab;
      text-decoration: none;
      font-weight: bold;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-url {
      color: #006621;
      font-size: 13px;
      margin-top: 4px;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .result-desc {
      color: #4d5156;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="container">
    
    <!-- Logo Alanı -->
    <div id="logo-container">
      <!-- Kendi logonu eklemek için src="logo.png" kısmını kendi görselinin yoluyla değiştir -->
      <a href="index.html">
        <img id="logo-img" src="Başlık ekle.png" alt="Arama Motoru Logos">
      </a>
    </div>

    <!-- Arama Formu (HTML4 Form Düzeneği) -->
    <table class="search-table" summary="Arama alanı">
      <tr>
        <td>
          <input type="text" id="searchInput" class="search-input" placeholder="Aramak istediğiniz sözcüğü yazın..." onkeyup="handleSearch()">
        </td>
      </tr>
    </table>

    <!-- Sonuçların Listelendiği Alan -->
    <ul id="results-list"></ul>

  </div>

  <script type="text/javascript">
    var fuse = null;

    // Repodaki index.json verisini çekme
    fetch('index.json')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        fuse = new Fuse(data, {
          keys: ['title', 'desc', 'url'],
          threshold: 0.4
        });
      })
      .catch(function(err) {
        console.error("Veritabanı okunamadı:", err);
      });

    function handleSearch() {
      if (!fuse) return;

      var query = document.getElementById('searchInput').value;
      var resultsUl = document.getElementById('results-list');
      resultsUl.innerHTML = '';

      if (!query.replace(/^\s+|\s+$/g, '')) return; // Trim kontrolü (HTML4/ES5 uyumlu)

      var results = fuse.search(query);
      for (var i = 0; i < results.length; i++) {
        var item = results[i].item;
        var li = document.createElement('li');
        li.className = 'result-item';

        li.innerHTML = 
          '<a class="result-title" href="' + item.url + '" target="_blank">' + item.title + '</a>' +
          '<div class="result-url">' + item.url + '</div>' +
          '<div class="result-desc">' + item.desc + '</div>';

        resultsUl.appendChild(li);
      }
    }
  </script>

</body>
</html>
